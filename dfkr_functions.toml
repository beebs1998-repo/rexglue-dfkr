# Dynamic entrypoints for the dfkr entrypoint XEX.
# Populate when playtesting hits
# "[FATAL] Call to invalid or unregistered function at guest address 0x..."
# AFTER the static hint pass (scripts/build_module_hints.ps1) did not cover
# the address (see AGENTS.md).

# Bootstrap seeds (initial codegen validation): 8 direct `b` targets in the
# shell code range that ReXGlue's analyzer does not detect as function starts
# either (same resolution dfkbl/mushi use for their curated ep seeds). The
# clean-codegen leg of scripts/build_module_hints.ps1 revalidates the
# entrypoint with ONLY this file in its include list, so these must live here
# rather than in dfkr_hints.toml.
[functions."0x82096120"]
name = "sub_82096120"

[functions."0x820B3B90"]
name = "sub_820B3B90"

[functions."0x82096110"]
name = "sub_82096110"

[functions."0x82094F58"]
name = "sub_82094F58"

[functions."0x82096848"]
name = "sub_82096848"

[functions."0x82094F48"]
name = "sub_82094F48"

[functions."0x820A6918"]
name = "sub_820A6918"

[functions."0x820B3540"]
name = "sub_820B3540"

# ==== iter-9 fix (2026-10-26) - first-playtest crash / loop-twin registrations ====
#
# Runtime crash 14 s after boot: [FATAL] Unresolved branch from 0x820A4C28 to
# 0x820A4A2C (dfkr_recomp.4.cpp - sub_820A4C04's bne cr6 jumps into the shared
# jump-table dispatch head at 0x820A4A2C, an unowned gap block between
# sub_820A49B8 and sub_820A4C04). Resolutions, dfkbl 0x820A4554 + futari
# switch-table precedent applied wholesale to the family both analyzers
# refuse to promote:
#   - Register every unique target of the triaged unresolved_call/branch
#     sites as a function (38 addresses, mid-block twins like dfkbl's class).
#   - [[switch_tables]] overrides for the three confirmed 4-byte dispatch
#     heads (cmp bounds cmplwi rX,0x14/0x5C/0x5D; table addresses traced in
#     the decrypted shell image; labels read out of the image).
# Allow-list entries for sites that resolve after registration become stale
# (gate notes them; removal expected at next validation pass).

